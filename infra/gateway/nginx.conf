# ==============================================================================
# Edge API Gateway + Load Balancer (nginx)
#
# Sits in front of the NestJS service and provides the edge concerns that do not
# belong in the application:
#   - Load balancing across N horizontally-scaled `app` replicas (Docker DNS).
#   - A coarse edge rate limit (defense in depth on top of the app's per-tenant
#     Redis limiter).
#   - Security headers, request-size limits, gzip, and proxy/forwarding headers.
#   - Structured JSON access logs carrying the X-Correlation-ID for end-to-end
#     tracing alongside the application logs.
#
# Verify locally:  docker compose -f docker-compose.yml -f docker-compose.scale.yml \
#                    up -d --build --scale app=3
#                  curl -i http://localhost:8080/health/live
# ==============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS. Re-resolving on each request is what spreads traffic
    # across all `app` replicas (round-robin) rather than pinning to one IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Coarse per-client edge throttle. The app enforces the precise per-tenant
    # quota; this just sheds obvious floods before they reach the backend.
    limit_req_zone $binary_remote_addr zone=edge:10m rate=20r/s;

    log_format json escape=json
        '{"time":"$time_iso8601","remote":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"request_time":$request_time,"upstream":"$upstream_addr",'
        '"correlation_id":"$http_x_correlation_id"}';
    access_log /var/log/nginx/access.log json;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_types application/json application/problem+json text/plain;

    server {
        listen 80;
        server_name _;

        client_max_body_size 1m;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Edge security headers (the app sets its own too; these protect even
        # error pages served by the gateway itself).
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # Health/probe path: never throttled, so orchestrator checks always pass.
        location /health/ {
            set $app_upstream http://app:3000;
            proxy_pass $app_upstream$request_uri;
            proxy_set_header Host $host;
        }

        location / {
            limit_req zone=edge burst=40 nodelay;
            limit_req_status 429;

            set $app_upstream http://app:3000;
            proxy_pass $app_upstream$request_uri;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Propagate / originate a correlation id for distributed tracing.
            proxy_set_header X-Correlation-ID $http_x_correlation_id;
        }
    }
}
